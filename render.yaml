services:

  - type: web
    name: secure-file-vault
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    envVars:

      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: FERNET_KEY
        sync: false

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: secure-file-vault-db
          property: connectionString


databases:

  - name: secure-file-vault-db
    plan: free