```html
<!DOCTYPE html>
<html>
<head>
    <title>File Access Logs</title>
</head>

<body>

    <h1>File Access Logs</h1>

    <table border="1" cellpadding="8">
        <tr>
            <th>Username</th>
            <th>IP Address</th>
            <th>File</th>
            <th>Timestamp</th>
        </tr>

        {% for log in logs %}
        <tr>
            <td>{{ log[0] }}</td>
            <td>{{ log[1] }}</td>
            <td>{{ log[2] }}</td>
            <td>{{ log[3] }}</td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
```
