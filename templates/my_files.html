<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Files - Secure File Vault</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #050b14;
            color: #e6edf3;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .header h1 {
            margin: 0;
            color: #00e5ff;
            font-size: 30px;
        }

        .back {
            text-decoration: none;
            color: #00e5ff;
            border: 1px solid #00e5ff;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .back:hover {
            background: #00e5ff;
            color: #050b14;
        }

        .card {
            background: #0b1422;
            border: 1px solid #1b344d;
            border-radius: 10px;
            padding: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #1b344d;
        }

        th {
            color: #00e5ff;
            font-size: 14px;
        }

        td {
            color: #d6e2ee;
        }

        .btn {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            margin-right: 5px;
        }

        .download {
            background: #00e5ff;
            color: #050b14;
        }

        .download:hover {
            background: #00bcd4;
        }

        .delete {
            background: #ff3b3b;
            color: white;
        }

        .delete:hover {
            background: #d92f2f;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #8fa3b8;
        }

        @media (max-width: 700px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 24px;
            }

            th,
            td {
                padding: 10px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>My Files</h1>

            <a
                href="/dashboard"
                class="back"
            >
                Back to Dashboard
            </a>

        </div>

        <div class="card">

            {% if files %}

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>File Name</th>

                        <th>Size</th>

                        <th>Uploaded At</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

                    {% for file in files %}

                    <tr>

                        <td>
                            {{ file[0] }}
                        </td>

                        <td>
                            {{ file[1] }}
                        </td>

                        <td>
                            {{ file[2] }} bytes
                        </td>

                        <td>
                            {{ file[3] }}
                        </td>

                        <td>

                            <a
                                href="/download-file/{{ file[0] }}"
                                class="btn download"
                            >
                                Download
                            </a>

                            <form
                                action="/delete-file/{{ file[0] }}"
                                method="POST"
                                style="display:inline;"
                                onsubmit="return confirm('Are you sure you want to delete this file? This action cannot be undone.');"
                            >

                                <button
                                    type="submit"
                                    class="btn delete"
                                >
                                    Delete
                                </button>

                            </form>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

            {% else %}

            <div class="empty">

                <p>No files uploaded yet.</p>

            </div>

            {% endif %}

        </div>

    </div>

    <script src="{{ url_for('static', filename='security.js') }}"></script>

</body>

</html>
