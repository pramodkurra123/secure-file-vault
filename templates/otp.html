<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification - Secure File Vault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b1120;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e5e7eb;
            padding: 20px;
        }

        .container {
            width: 420px;
            max-width: 100%;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #172554;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
            color: #f9fafb;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .security-box {
            background: #0f172a;
            border: 1px solid #1e3a5f;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 22px;
            text-align: center;
            font-size: 13px;
            color: #93c5fd;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #d1d5db;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0f172a;
            color: #ffffff;
            text-align: center;
            font-size: 22px;
            letter-spacing: 7px;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        input::placeholder {
            color: #6b7280;
            letter-spacing: 3px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #450a0a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            text-align: center;
        }

        .info {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            line-height: 1.6;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🔐</div>

        <h1>OTP Verification</h1>

        <p class="subtitle">
            Enter the 6-digit verification code sent to your registered email address.
        </p>

        <div class="security-box">
            Your OTP is valid for <strong>5 minutes</strong>.<br>
            Maximum <strong>3 attempts</strong> are allowed.
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="otp">Verification Code</label>

            <input
                type="text"
                id="otp"
                name="otp"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="000000"
                required
            >

            <button type="submit">
                Verify OTP
            </button>

        </form>

        <p class="info">
            For your security, never share your OTP with anyone.
        </p>

        <a href="/login" class="back">
            ← Back to Login
        </a>

    </div>

</body>
</html>
